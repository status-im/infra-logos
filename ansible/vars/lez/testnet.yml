---
# Logos Execution Zone - Testnet
lez_name: 'testnet'
lez_cont_tag: 'v0.3.0'
lez_blockchain_cont_tag: '0.3.0'
lez_explorer_cont_port:          8081
lez_sequencer_rpc_base_port:     3040
lez_sequencer_libp2p_base_port:  4040
lez_sequencer_metrics_base_port: 9000
lez_indexer_cont_port:           8779
lez_blockchain_cont_api_port:    8080
lez_blockchain_cont_swarm_port:  3000
lez_sequencer_funding_key: '677633bf03fecfd54aa4620a671976b5cd7ef9b6851c3eb024ac74129d132604'
lez_sequencer_channel_id:  '0303030303030303030303030303030303030303030303030303030303030303'
lez_sequencer_count: 4
lez_sequencer_image: 'harbor.status.im/logos-blockchain/logos-execution-zone/sequencer_service:{{ lez_cont_tag }}'
lez_sequencer_keys:
  - signing_key:         '{{ lookup("vault", "lez/"+lez_name+"/sequencer/seq-0", field="signing_key") }}'
    bedrock_signing_key: '{{ lookup("vault", "lez/"+lez_name+"/sequencer/seq-0", field="bedrock_signing_key") }}'
  - signing_key:         '{{ lookup("vault", "lez/"+lez_name+"/sequencer/seq-1", field="signing_key") }}'
    bedrock_signing_key: '{{ lookup("vault", "lez/"+lez_name+"/sequencer/seq-1", field="bedrock_signing_key") }}'
  - signing_key:         '{{ lookup("vault", "lez/"+lez_name+"/sequencer/seq-2", field="signing_key") }}'
    bedrock_signing_key: '{{ lookup("vault", "lez/"+lez_name+"/sequencer/seq-2", field="bedrock_signing_key") }}'
  - signing_key:         '{{ lookup("vault", "lez/"+lez_name+"/sequencer/seq-3", field="signing_key") }}'
    bedrock_signing_key: '{{ lookup("vault", "lez/"+lez_name+"/sequencer/seq-3", field="bedrock_signing_key") }}'
lez_blockchain_initial_peers:
  - '/ip4/65.109.51.37/udp/3000/quic-v1/p2p/12D3KooWFrouXfmrR4nsLMtE7wu15DoMJ6VtoUtHinREZCvbWHar'
  - '/ip4/65.109.51.37/udp/3001/quic-v1/p2p/12D3KooWJRGau8M1rjT7R5e4YYsgdFhsMX35nRDtMwCDjxQkXAHz'
  - '/ip4/65.109.51.37/udp/3002/quic-v1/p2p/12D3KooWQXJavMDTRscjauFSgVAB1VLB6Rzpy2uY5SU9Tk7927tb'
  - '/ip4/65.109.51.37/udp/50001/quic-v1/p2p/12D3KooWSQc7CcGtvWDPF1yCbBthFnQjprfCVHmfmNDUrSmqQsU1'

# Nginx
nginx_sites:
  lez_testnet_rpc_https:
    - listen 443 ssl
    - server_name {{ lez_rpc_domain }}
    - ssl_certificate     /etc/letsencrypt/live/{{ lez_rpc_domain }}/fullchain.pem
    - ssl_certificate_key /etc/letsencrypt/live/{{ lez_rpc_domain }}/privkey.pem
    - location / {
        proxy_pass http://localhost:{{ lez_sequencer_rpc_base_port }}/;
      }

  lez_testnet_explorer_https:
    - listen 443 ssl
    - server_name {{ lez_explorer_domain }}
    - ssl_certificate     /etc/letsencrypt/live/{{ lez_rpc_domain }}/fullchain.pem
    - ssl_certificate_key /etc/letsencrypt/live/{{ lez_rpc_domain }}/privkey.pem
    - location / {
        proxy_pass http://localhost:{{ lez_explorer_cont_port }}/;
      }


# Firewall
open_ports_list:
  nginx:
    - { port: [80, 443], proto: 'tcp', comment: 'Nginx and Certbot' }

  lez-testnet-blockchain:
    - { port: '{{ lez_blockchain_cont_swarm_port }}', proto: tcp, comment: 'Logos Blockchain Swarm ({{ lez_name }})' }
    - { port: '{{ lez_blockchain_cont_api_port }}',   ipset: 'bi.test', iifname: 'wg0', comment: 'BI data extraction ({{ lez_name }})' }
    - { port: '{{ lez_sequencer_rpc_base_port }}',    ipset: 'bi.test', iifname: 'wg0', comment: 'BI data extraction ({{ lez_name }})' }
    - { port: '{{ lez_indexer_cont_port }}',          ipset: 'bi.test', iifname: 'wg0', comment: 'BI data extraction ({{ lez_name }})' }
    - { port: '{{ lez_blockchain_cont_api_port }}',   ipset: 'bi.prod', iifname: 'wg0', comment: 'BI data extraction ({{ lez_name }})' }
    - { port: '{{ lez_sequencer_rpc_base_port }}',    ipset: 'bi.prod', iifname: 'wg0', comment: 'BI data extraction ({{ lez_name }})' }
    - { port: '{{ lez_indexer_cont_port }}',          ipset: 'bi.prod', iifname: 'wg0', comment: 'BI data extraction ({{ lez_name }})' }

  lez-testnet-sequencer:
    - { port: '{{ lez_sequencer_libp2p_base_port }}-{{ lez_sequencer_libp2p_base_port + lez_sequencer_count }}',
        comment: 'Sequencer libp2p ({{ lez_name }})',  proto: udp }
    - { port: '{{ lez_sequencer_metrics_base_port }}-{{ lez_sequencer_metrics_base_port + lez_sequencer_count }}',
        comment: 'Sequencer metrics ({{ lez_name }})', ipset: 'hq.metrics', iifname: 'wg0' }
