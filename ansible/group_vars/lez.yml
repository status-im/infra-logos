# Certbot
certbot_docker_enabled: true
certbot_admin_email: 'devops@status.im'
certbot_services_to_stop: ['nginx']
certbot_certs:
  - domains:
      - '{{ lez_rpc_domain }}'
      - '{{ lez_explorer_domain }}'

# Nginx
nginx_sites:
  lez_rpc_https:
    - listen 443 ssl
    - server_name {{ lez_rpc_domain }}

    - ssl_certificate     /etc/letsencrypt/live/{{ lez_rpc_domain }}/fullchain.pem
    - ssl_certificate_key /etc/letsencrypt/live/{{ lez_rpc_domain }}/privkey.pem

    - location / {
        proxy_pass http://localhost:{{ lez_sequencer_cont_base_port }}/;
      }

  lez_explorer_https:
    - listen 443 ssl
    - server_name {{ lez_explorer_domain }}

    - ssl_certificate     /etc/letsencrypt/live/{{ lez_rpc_domain }}/fullchain.pem
    - ssl_certificate_key /etc/letsencrypt/live/{{ lez_rpc_domain }}/privkey.pem

    - location / {
        proxy_pass http://localhost:{{ lez_explorer_cont_port }}/;
      }

# Firewall
open_ports_list:
  nginx:
    - { port: [80, 443], proto: 'tcp', comment: 'Nginx and Certbot' }
  logos-blockchain:
    - { port: '{{ lez_blockchain_cont_swarm_port }}', proto: tcp, comment: 'Logos Blockchain Swarm' }
    - { port: '{{ lez_blockchain_cont_api_port }}', ipset: 'bi.test', iifname: 'wg0', comment: 'BI data extraction' }
    - { port: '{{ lez_sequencer_cont_base_port }}', ipset: 'bi.test', iifname: 'wg0', comment: 'BI data extraction' }
    - { port: '{{ lez_indexer_cont_port }}', ipset: 'bi.test', iifname: 'wg0', comment: 'BI data extraction' }
  logos-sequencer:
    - { port: '9000-9003', comment: 'Sequencer metrics', ipset: 'hq.metrics', iifname: 'wg0' }



