# Logos Execution Zone
lez_rpc_domain: '{{ stage }}net.lez.logos.co'
lez_explorer_domain: 'explorer.{{ stage }}net.lez.logos.co'
lez_service_name: 'logos-exec-zone-{{ stage }}net'
lez_explorer_cont_port: 8081
lez_sequencer_cont_base_port: 3040
lez_indexer_cont_port: 8779
lez_cont_tag: '{{ lez_cont_tag_map[stage] }}'
lez_cont_tag_map:
  dev:  'v0.2.5-rc2'
  test: 'v0.2.4'
lez_blockchain_cont_tag: '{{ lez_blockchain_cont_tag_map[stage] }}'
lez_blockchain_cont_tag_map:
  dev:  '0.3.0-rc.2'
  test: '0.2.4'
lez_blockchain_cont_api_port: 8080
lez_blockchain_cont_swarm_port: 3000
lez_blockchain_keystore_config: '{{ lookup("vault", "lez/blockchain", field="keystore") }}'
lez_blockchain_deployment_config: '{{ lookup("ansible.builtin.file", "../files/lez/"+stage+"/blockchain_deployment.yaml") | mandatory }}'
lez_sequencer_config: '{{ lookup("ansible.builtin.file", "../files/lez/"+stage+"/sequencer_config.json") | mandatory }}'
lez_sequencer_count: '{{ lez_sequencer_count_map[stage] }}'
lez_sequencer_count_map:
  dev: 4
  test: 1
lez_sequencer_cont_image: '{{ lez_sequencer_image_map[stage] }}'
lez_sequencer_image_map:
  dev: 'harbor.status.im/logos-blockchain/logos-execution-zone/sequencer_service-mdns:{{ lez_cont_tag }}'
  test: 'harbor.status.im/logos-blockchain/logos-execution-zone/sequencer_service:{{ lez_cont_tag }}'
lez_sequencer_keys: '{{ lez_sequencer_keys_map[stage] | default([]) }}'
lez_sequencer_keys_map:
  dev:
    - signing_key: '{{ lookup("vault", "lez/sequencer/seq-0", field="signing_key") }}'
      bedrock_signing_key: '{{ lookup("vault", "lez/sequencer/seq-0", field="signing_key") }}'
    - signing_key: '{{ lookup("vault", "lez/sequencer/seq-1", field="signing_key") }}'
      bedrock_signing_key: '{{ lookup("vault", "lez/sequencer/seq-1", field="signing_key") }}'
    - signing_key: '{{ lookup("vault", "lez/sequencer/seq-2", field="signing_key") }}'
      bedrock_signing_key: '{{ lookup("vault", "lez/sequencer/seq-2", field="signing_key") }}'
    - signing_key: '{{ lookup("vault", "lez/sequencer/seq-3", field="signing_key") }}'
      bedrock_signing_key: '{{ lookup("vault", "lez/sequencer/seq-3", field="signing_key") }}'
lez_sequencer_log_level: 'debug,kameo=info'
lez_indexer_config: '{{ lookup("ansible.builtin.file", "../files/lez/"+stage+"/indexer_config.json") | mandatory }}'
lez_blockchain_initial_peers: '{{ lez_blockchain_initial_peers_map[stage] }}'
lez_blockchain_initial_peers_map:
  dev:
    - '/ip4/65.108.203.235/udp/3000/quic-v1/p2p/12D3KooWNbZTQ86TZ9MrZ2wm6iUFFj25AFTzFLUD7i6XkZHoUzU8'
    - '/ip4/65.108.203.235/udp/3001/quic-v1/p2p/12D3KooWNhXaH4XTX6Pp66NDQZxZpXYQzeruwwraMvTxojz1QXPJ'
    - '/ip4/65.108.203.235/udp/3002/quic-v1/p2p/12D3KooWNTLPg5uYPKgZCDvzyaWNwZNcwVKmfS2bNv52E9L9P7Hf'
    - '/ip4/65.108.203.235/udp/50001/quic-v1/p2p/12D3KooWMULUG8RXC2esnfLcVzGHohf6KNPSswkCKa1mdpXz4tHH'
  test:
    - '/ip4/65.109.51.37/udp/3000/quic-v1/p2p/12D3KooWFrouXfmrR4nsLMtE7wu15DoMJ6VtoUtHinREZCvbWHar'
    - '/ip4/65.109.51.37/udp/3001/quic-v1/p2p/12D3KooWJRGau8M1rjT7R5e4YYsgdFhsMX35nRDtMwCDjxQkXAHz'
    - '/ip4/65.109.51.37/udp/3002/quic-v1/p2p/12D3KooWQXJavMDTRscjauFSgVAB1VLB6Rzpy2uY5SU9Tk7927tb'
