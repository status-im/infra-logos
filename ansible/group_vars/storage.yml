logos_node_storage_preload_content:
  - url: 'https://logos.co/book/farewell-to-westphalia-foss-edition.pdf'
    block_size: 65536

# Consul
logos_node_consul_success_before_passing: 5
logos_node_consul_failures_before_warning: 2
logos_node_consul_failures_before_critical: 20

# LetsEncrypt via Certbot
certbot_docker_enabled: true
certbot_admin_email: 'devops@status.im'
certbot_services_to_stop: ['nginx']
certbot_certs:
  - domains:
    - '{{ logos_node_storage_api_domain }}'

nginx_auth_basic_files:
  storage-api:
    - '{{ lookup("vault", "storage/api", field="user") }}:{{ lookup("vault", "storage/api", field="pass-hash") }}'

nginx_configs:
  proxy:
    - proxy_set_header Host $host
    - proxy_set_header X-Real-IP $remote_addr
    - proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for

nginx_sites:
  storage-api:
    - listen 443 ssl
    - server_name {{ logos_node_storage_api_domain }}
    - ssl_certificate /etc/letsencrypt/live/{{ logos_node_storage_api_domain }}/fullchain.pem
    - ssl_certificate_key /etc/letsencrypt/live/{{ logos_node_storage_api_domain }}/privkey.pem
    - client_max_body_size 512m
    - client_body_timeout 600s
    - proxy_request_buffering off
    - |
      location /api/storage/v1/data {
        auth_basic            "logos-storage";
        auth_basic_user_file  auth_basic/storage-api;
        proxy_pass            http://127.0.0.1:{{ logos_node_storage_api_port }};
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
      }
    - location / { return 404; }

# Open Ports
open_ports_list:
  certbot:
    - { port: '80', comment: 'Certbot' }
  logos-node:
    - { port: '443', comment: 'storage API' }
    - { port: '{{ logos_node_storage_tcp_port }}',  comment: 'storage libp2p'                                         }
    - { port: '{{ logos_node_metrics_port }}',      comment: 'storage metrics',   ipset: 'hq.metrics', iifname: 'wg0' }