---
bootstrap__logrotate_frequency: 'hourly'
bootstrap__logrotate_timer_frequency: '*:0/30'

# Container
logos_node_cont_tag: 'deploy-storage-dev'
logos_node_cont_name: 'logos-node'
logos_node_cont_vol: '/docker/{{ logos_node_cont_name }}'
logos_node_conf_path: '{{ logos_node_cont_vol }}/conf'
logos_node_log_level: 'DEBUG'
logos_node_watchtower_enabled: true

# Node identity
# NOTE: generate: printf '08021220'; openssl rand -hex 32
logos_node_storage_key: '{{ lookup("vault", "storage/nodekeys", field=inventory_hostname) }}'

# Modules: storage only
logos_node_modules: ['storage_module']
logos_node_module_calls:
  - 'storage_module init @/conf/storage_config.json'
  - 'storage_module start'

# Storage network
logos_node_storage_tcp_port: 8080
logos_node_storage_nat: 'extip:{{ logos_node_public_address }}'
logos_node_metrics_port: 8008

# Storage API (RS nodes only)
logos_node_storage_api_enabled: "{{ logos_node_storage_role == 'rs' }}"
logos_node_storage_api_port: 8091
logos_node_storage_api_bindaddr: '0.0.0.0'
logos_node_storage_api_domain: '{{ dns_entry }}'

# Storage config
logos_node_storage_data_dir: '/data'

# Mix-Proxy network (minimum 4 MP nodes, first one bootstraps)
logos_node_storage_mp_nodes:
  - storage-01.do-ams3.logos.dev
  - storage-02.do-ams3.logos.dev
  - storage-01.gc-us-central1-a.logos.dev
  - storage-01.ac-cn-hongkong-c.logos.dev

logos_node_storage_first_node: 'storage-01.do-ams3.logos.dev'
logos_node_storage_role: "{{ 'mp' if inventory_hostname in logos_node_storage_mp_nodes else 'rs' }}"
logos_node_storage_no_bootstrap: "{{ inventory_hostname == logos_node_storage_first_node }}"

