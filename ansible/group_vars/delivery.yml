---
bootstrap__logrotate_frequency: 'hourly'
bootstrap__logrotate_timer_frequency: '*:0/30'

bootstrap__rsyslog_filter_rules:
  - 'storeMessageDbUrl'

# Container
logos_node_delivery_version: '0.1.3'
logos_node_cont_tag: '{{ stage }}-d{{ logos_node_delivery_version }}'
logos_node_cont_name: 'logos-node'
logos_node_cont_vol: '/docker/{{ logos_node_cont_name }}'
logos_node_conf_path: '{{ logos_node_cont_vol }}/conf'
logos_node_log_level: 'DEBUG'

# Modules: delivery only
logos_node_modules: ['delivery_module']
logos_node_module_calls:
  - 'delivery_module createNode @/conf/waku_config.json'
  - 'delivery_module start'

# Node identity
logos_node_delivery_key: '{{ lookup("vault", "delivery/nodekeys", field=hostname) }}'
logos_node_delivery_mix_key: '{{ lookup("vault", "delivery/mixkeys", field=hostname) }}'

# Network
logos_node_delivery_cluster_id: 2
logos_node_delivery_num_shards_in_network: 8
logos_node_delivery_dns4_domain_name: '{{ dns_entry }}'

# Protocols
logos_node_delivery_protocols_enabled: ['relay', 'store', 'filter', 'lightpush', 'mix']
logos_node_delivery_discv5: true
logos_node_delivery_kad_discovery: true

# P2P
logos_node_delivery_max_connections: 300

# Ports
logos_node_delivery_p2p_tcp_port: 30303
logos_node_delivery_discv5_udp_port: 9000
logos_node_delivery_websocket_port: 8000
logos_node_metrics_port: 8008

# Websocket
logos_node_delivery_websocket_enabled: false
logos_node_delivery_websocket_secure_enabled: false
logos_node_delivery_websocket_domain: '{{ dns_entry }}'

# Store - Postgres
logos_node_delivery_store_db_url: 'postgres://delivery:{{ lookup("vault", "delivery/database", field="db-password") }}@delivery-db-01.{{ ansible_domain }}.wg:5432/delivery'
logos_node_delivery_store_retention_policy: 'time:259200;size:50GB'

# Kademlia bootstrap - populate after first deploy
logos_node_delivery_kad_bootstrap_nodes:
  - '/dns4/delivery-01.do-ams3.logos.dev.status.im/tcp/30303/p2p/16Uiu2HAmTUbnxLGT9JvV6mu9oPyDjqHK4Phs1VDJNUgESgNSkuby'
  - '/dns4/delivery-02.do-ams3.logos.dev.status.im/tcp/30303/p2p/16Uiu2HAmMK7PYygBtKUQ8EHp7EfaD3bCEsJrkFooK8RQ2PVpJprH'
  - '/dns4/delivery-01.gc-us-central1-a.logos.dev.status.im/tcp/30303/p2p/16Uiu2HAm4S1JYkuzDKLKQvwgAhZKs9otxXqt8SCGtB4hoJP1S397'
  - '/dns4/delivery-02.gc-us-central1-a.logos.dev.status.im/tcp/30303/p2p/16Uiu2HAm8Y9kgBNtjxvCnf1X6gnZJW5EGE4UwwCL3CCm55TwqBiH'
  - '/dns4/delivery-01.ac-cn-hongkong-c.logos.dev.status.im/tcp/30303/p2p/16Uiu2HAm8YokiNun9BkeA1ZRmhLbtNUvcwRr64F69tYj9fkGyuEP'
  - '/dns4/delivery-02.ac-cn-hongkong-c.logos.dev.status.im/tcp/30303/p2p/16Uiu2HAkvwhGHKNry6LACrB8TmEFoCJKEX29XR5dDUzk3UT3UNSE'

# Consul
logos_node_consul_success_before_passing: 5
logos_node_consul_failures_before_warning: 2
logos_node_consul_failures_before_critical: 20

# LetsEncrypt via Certbot
certbot_docker_enabled: true
certbot_admin_email: 'devops@status.im'
certbot_containers_to_stop: ['{{ logos_node_cont_name }}']
certbot_certs:
  - domains:
    - '{{ logos_node_delivery_websocket_domain }}'

conn_limit_dport: '{{ logos_node_delivery_websocket_port }}'

# Open Ports
open_ports_list:
  certbot:
    - { port: '80', comment: 'Certbot' }
  logos-node:
    - { port: '{{ logos_node_delivery_p2p_tcp_port }}',                             comment: 'libp2p'       }
    - { port: '{{ logos_node_delivery_discv5_udp_port }}', protocol: 'udp',         comment: 'discovery v5' }
    - { port: '{{ logos_node_delivery_websocket_port }}',                           comment: 'websocket'    }
    - { port: '{{ logos_node_metrics_port }}', ipset: 'hq.metrics', iifname: 'wg0', comment: 'metrics'      }