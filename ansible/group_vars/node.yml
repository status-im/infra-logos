  - '/dns4/node-01.gc-us-central1-a.logos.test.status.im/tcp/30303/p2p/16Uiu2HAmF8WtwGPmeGHgYAX2277jHgy5cW9F7zsB8EqUjBZQAZQ3'
  - '/dns4/node-02.gc-us-central1-a.logos.test.status.im/tcp/30303/p2p/16Uiu2HAmUuXhUW9bdJpzN1kfDziFiUZo4bszTk66cvr7uuyCHXR7'
  - '/dns4/node-01.ac-cn-hongkong-c.logos.test.status.im/tcp/30303/p2p/16Uiu2HAmL3oU95jh1BZHozn3uNhx8HEneirgr8M1jEAapzXGDqRF'
  - '/dns4/node-02.ac-cn-hongkong-c.logos.test.status.im/tcp/30303/p2p/16Uiu2HAm28CoBZjpyxsanC8tQpbvZ7bZJnVYuB1EgFzb571qpWsV'

# --- Storage ---

logos_node_storage_key: '{{ lookup("vault", "node/storage/nodekeys", field=hostname) }}'

logos_node_storage_tcp_port: 8070
logos_node_storage_disc_port: 9090
logos_node_storage_nat: 'extip:{{ logos_node_public_address }}'
logos_node_storage_max_peers: 160

logos_node_storage_api_port: 8091
logos_node_storage_api_bindaddr: '0.0.0.0'

logos_node_storage_metrics_enabled: true
logos_node_storage_metrics_port: 8008

logos_node_storage_data_dir: '/data'
logos_node_storage_quota: 21474836480
logos_node_storage_block_ttl: '4w2d'

# Mix-Proxy network (minimum 4 MP nodes, first one bootstraps)
logos_node_storage_mix_enabled: true
logos_node_storage_mp_nodes:
  - node-01.do-ams3.logos.test
  - node-02.do-ams3.logos.test
  - node-01.gc-us-central1-a.logos.test
  - node-01.ac-cn-hongkong-c.logos.test

logos_node_storage_first_node: 'node-01.do-ams3.logos.test'
logos_node_storage_role: "{{ 'mp' if inventory_hostname in logos_node_storage_mp_nodes else 'rs' }}"
logos_node_storage_no_bootstrap: "{{ inventory_hostname == logos_node_storage_first_node }}"

