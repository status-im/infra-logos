logos_node_storage_preload_content:
  - url: 'https://logos.co/book/farewell-to-westphalia-foss-edition.pdf'
    block_size: 65536

# --- Blockchain ---

logos_node_blockchain_deployment: 'testnet'
logos_node_blockchain_peer_response_timeout: 30000

logos_node_blockchain_node_key: '{{ lookup("vault", "node/blockchain/nodekeys", field=hostname) }}'
logos_node_blockchain_blend_signing_key: '{{ lookup("vault", "node/blockchain/blend-signing", field=hostname) }}'
logos_node_blockchain_blend_zk_key: '{{ lookup("vault", "node/blockchain/blend-zk", field=hostname) }}'
logos_node_blockchain_funding_pk: '{{ lookup("vault", "node/blockchain/funding", field=hostname) }}'
logos_node_blockchain_voucher_master_key: '{{ lookup("vault", "node/blockchain/voucher", field=hostname) }}'
logos_node_blockchain_kms_blend_signing: '{{ lookup("vault", "node/blockchain/kms-blend-signing", field=hostname) }}'
logos_node_blockchain_kms_funding: '{{ lookup("vault", "node/blockchain/kms-funding", field=hostname) }}'
logos_node_blockchain_kms_voucher: '{{ lookup("vault", "node/blockchain/kms-voucher", field=hostname) }}'
logos_node_blockchain_kms_blend_zk: '{{ lookup("vault", "node/blockchain/kms-blend-zk", field=hostname) }}'

logos_node_blockchain_swarm_port: 3000
logos_node_blockchain_blend_port: 3400
logos_node_blockchain_api_port: 8080

logos_node_blockchain_initial_peers: []

# --- Consul ---

logos_node_consul_success_before_passing: 1
logos_node_consul_failures_before_warning: 2
logos_node_consul_failures_before_critical: 20

# --- LetsEncrypt via Certbot ---

certbot_docker_enabled: true
certbot_admin_email: 'devops@status.im'
certbot_containers_to_stop: ['{{ logos_node_cont_name }}']
certbot_certs:
  - domains:
    - '{{ logos_node_delivery_websocket_domain }}'

conn_limit_dport: '{{ logos_node_delivery_websocket_port }}'

# --- Open Ports ---

open_ports_list:
  certbot:
    - { port: '80', comment: 'Certbot' }
  logos-node:
    - { port: '{{ logos_node_delivery_p2p_tcp_port }}',         comment: 'delivery libp2p' }
    - { port: '{{ logos_node_delivery_discv5_udp_port }}',      comment: 'delivery discv5',    protocol: 'udp' }
    - { port: '{{ logos_node_delivery_websocket_port }}',       comment: 'delivery WSS' }
    - { port: '{{ logos_node_storage_tcp_port }}',              comment: 'storage libp2p' }
    - { port: '{{ logos_node_storage_disc_port }}',             comment: 'storage discovery',  protocol: 'udp' }
    - { port: '{{ logos_node_storage_metrics_port }}',          comment: 'storage metrics',    ipset: 'hq.metrics', iifname: 'wg0' }
    - { port: '{{ logos_node_blockchain_swarm_port }}',         comment: 'blockchain swarm',   protocol: 'udp' }
    - { port: '{{ logos_node_blockchain_blend_port }}',         comment: 'blockchain blend',   protocol: 'udp' }