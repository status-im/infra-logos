---
- name: Create config directories
  file:
    path: '{{ item }}'
    owner: '{{ lez_host_uid }}'
    group: dockremap
    state: directory
    mode: '0775'
  with_items:
    - '{{ lez_service_conf }}'
    - '{{ lez_indexer_cont_vol }}'
    - '{{ lez_blockchain_state_path }}'
    - '{{ lez_blockchain_config_path }}'
    - '{{ lez_indexer_config_path | dirname }}'
    - '{{ lez_sequencer_config_path | dirname }}'
    - '{{ lez_sequencer_vol }}'

- name: Create sequencer config files
  register: lez_sequencer_config_files
  template:
    src:   'config.json.j2'
    dest:  '{{ seq_config_path }}'
    owner: '{{ lez_host_uid }}'
    group: 'dockremap'
    mode:  '0o660'
  vars:
    seq_config_path: '{{ lez_service_conf }}/sequencer/seq-{{ idx }}/sequencer_config.json'
    lez_config_content: >
      {{ lez_sequencer_config_extra | combine(lez_sequencer_config_overrides, recursive=true) }}
  loop: '{{ lez_sequencer_keys }}'
  loop_control:
    index_var: idx
    label: '{{ seq_config_path }}'

- name: Create indexer config
  register: lez_indexer_config_file
  template:
    src:   'config.json.j2'
    dest:  '{{ lez_indexer_config_path }}'
    owner: '{{ lez_host_uid }}'
    group: 'dockremap'
    mode:  '0o660'
  vars:
    lez_config_content: '{{ lez_indexer_config }}'

- name: Check blockchain config
  register: lez_blockchain_config_file
  stat:
    path: '{{ lez_blockchain_config_file_path }}'

- name: Create blockchain deployment settings
  when: lez_blockchain_deployment_config is defined
  copy:
    dest:    '{{ lez_blockchain_deployment_path }}'
    content: '{{ lez_blockchain_deployment_config }}'
    owner:   '{{ lez_host_uid }}'
    group:   'dockremap'
    mode:    '0644'

- name: Create blockchain keystore config
  when:
    - lez_blockchain_keystore_config is defined
    - lez_blockchain_config_file.stat.exists
  copy:
    dest:    '{{ lez_blockchain_keystore_file_path }}'
    content: '{{ lez_blockchain_keystore_config }}'
    owner:   '{{ lez_host_uid }}'
    group:   'dockremap'
    mode:    '0400'
